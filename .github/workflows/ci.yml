name: CI

on:
  push:
    branches: [build/aml-pipeline, main]
  pull_request:

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # The competition data is not in the repository, so the suite runs on the
      # fixtures the tests build themselves. Anything needing fintech_data/ is
      # skipped rather than failed.
      - run: pytest -q

  site:
    name: Site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: eda-website/package-lock.json
      - run: npm ci
        working-directory: eda-website
      - run: npm run build
        working-directory: eda-website
      - name: docs/ must match the committed build
        run: |
          if ! git diff --quiet -- docs/; then
            echo "::error::docs/ is stale. Run 'cd eda-website && npm run build' and commit the result."
            git diff --stat -- docs/
            exit 1
          fi
          echo "docs/ is up to date with eda-website/"
